[versions]
androidx-activityCompose = "1.13.0"
androidx-lifecycle = "2.11.0"
biometric = "1.4.0-alpha07"
compose-lifecycle = "2.11.0"
compose-plugin = "1.12.2"
compose-navigation = "2.10.0"
graphics-shapes = "1.0.0-alpha09"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"
koin = "4.2.2"
kotlin-logging = "2.2.0"
material3 = "1.12.0-alpha03"
appcompat = "1.8.0"

ktfmt = "0.64"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }

biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

compose-navigation = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "compose-navigation" }
compose-lifecycle = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime", version.ref = "compose-lifecycle" }

foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-plugin" }
graphics-shapes = { group = "org.jetbrains.androidx.graphics", name = "graphics-shapes", version.ref = "graphics-shapes" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-compose-viewmodel-navigation = { module = "io.insert-koin:koin-compose-viewmodel-navigation" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

kotlin-logging = { module = "co.touchlab:kermit", version.ref = "kotlin-logging" }

material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-plugin" }
ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-plugin" }
ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-plugin" }
components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-plugin"}

# Used only by the vendored formatter plugin in plugins/ktfmt
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }
