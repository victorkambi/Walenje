kotlin.code.style=official

# Gradle. Heap sizes match Tajji central: the Gradle daemon also runs the Kotlin/Native compiler and R8, and the
# Kotlin daemon gets its own heap instead of copying Gradle's.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Android. AGP 9 built-in Kotlin and the new DSL, no compatibility flags.
android.useAndroidX=true

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# Compose for macOS (native) is experimental; the macOS app depends on it.
org.jetbrains.compose.experimental.macos.enabled=true

# iOS and macOS targets are opt-in; see settings.gradle.kts.
walenje.apple=false
