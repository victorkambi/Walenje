# Applied by every Walenje module (replaces walenje-kmp, walenje-format-code and the Compose half of walenje-cmp-base).
settings:
  kotlin:
    version: 2.4.21
  jvm:
    release: 21
  compose:
    enabled: true
    version: 1.12.2

plugins:
  ktfmt:
    enabled: true
    style: google
    maxWidth: 100
    removeUnusedImports: true
