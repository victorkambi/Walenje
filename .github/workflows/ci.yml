name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macOS for the iOS and macOS targets; the image also ships the Android SDK (ANDROID_HOME).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JetBrains Runtime 25 matches gradle/gradle-daemon-jvm.properties, so Gradle doesn't download
      # another JDK for its daemon or the jvmToolchain(25) compilations.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-version: "25"

      # Caches ~/.gradle (dependencies, wrapper, build cache) between runs.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The Kotlin/Native compiler and its LLVM toolchain (about 3 GB), keyed on the Kotlin version.
      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Finish Xcode first-launch setup
        run: xcodebuild -runFirstLaunch

      - name: Show Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # Specific debug and test tasks, never `build`: it would also link release binaries for every
      # Apple target, the slowest Kotlin/Native work. The iOS app itself is built by Xcode, which
      # can need a multi-GB iOS platform download on the runner, so CI stops at its framework.
      - name: Build, test and check formatting
        timeout-minutes: 45
        run: >-
          ./gradlew -Pwalenje.apple=true --continue
          :app:android:assembleDebug
          :app:desktop:jvmJar
          :app:common:linkDebugFrameworkIosSimulatorArm64
          :app:macos:assembleMacosAppDebug
          jvmTest testAndroidHostTest iosSimulatorArm64Test macosArm64Test
          ktfmtCheck
