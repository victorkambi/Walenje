name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macOS for the iOS targets; the image also ships the Android SDK (ANDROID_HOME) and a full JDK
    # (JAVA_HOME), which the ktfmt plugin needs for its worker.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      KOTLIN_CLI_NO_WELCOME_BANNER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'libs.versions.toml', 'project.yaml', '**/module.yaml', 'templates/*.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Finish Xcode first-launch setup
        run: xcodebuild -runFirstLaunch

      - name: Build
        run: ./kotlin build

      - name: Test and check formatting
        run: ./kotlin check
