name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macOS for the iOS targets; the image also ships the Android SDK (ANDROID_HOME) and a full JDK
    # (JAVA_HOME), which the ktfmt plugin needs for its worker.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      KOTLIN_CLI_NO_WELCOME_BANNER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Restore and save separately so a failed or cancelled run still leaves the downloads cached.
      - name: Restore Kotlin Toolchain downloads
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'libs.versions.toml', 'project.yaml', '**/module.yaml', 'templates/*.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Finish Xcode first-launch setup
        run: xcodebuild -runFirstLaunch

      - name: Show Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # The iOS app is left out: building it runs downloadIosPlatform, which silently downloads the iOS
      # platform (several GB) when the runner's Xcode lacks one, and stalled the step past its timeout.
      # `./kotlin check` still compiles, links and tests every module for the iOS simulator.
      - name: Build
        timeout-minutes: 30
        run: ./kotlin build -p jvm -p android -p macosArm64

      - name: Test and check formatting
        timeout-minutes: 30
        run: ./kotlin check

      - name: Package the macOS app
        run: scripts/macos-app.sh

      - name: Save Kotlin Toolchain downloads
        if: always() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
