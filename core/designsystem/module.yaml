product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

apply:
  - //templates/base.module-template.yaml
  - //templates/android.module-template.yaml
  - //templates/cmp.module-template.yaml

dependencies:
  - $libs.components.resources: exported
  - $libs.graphics.shapes: exported

settings:
  android:
    namespace: kambi.victor.walenje.core.designsystem
  compose:
    resources:
      packageName: walenje.core.designsystem.generated.resources
