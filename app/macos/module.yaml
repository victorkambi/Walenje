# Native macOS app (Kotlin/Native + Compose for macOS, no JVM). Builds a plain executable, not an .app bundle.
product:
  type: macos/app
  platforms: [macosArm64]

apply:
  - //templates/base.module-template.yaml

dependencies:
  - //app/common
  - //core/authentication
  - $libs.ui

settings:
  native:
    entryPoint: kambi.victor.walenje.main
